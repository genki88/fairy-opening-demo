<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>法芮 FAIRY｜門店開店輔導 90 天平台</title>
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ============ 法芮 FAIRY 設計權杖（單一來源）============ */
:root{
  --ink:#4F2F2E;          /* Pantone 497C 主色 */
  --ink-soft:#6B4E45;
  --clay:#AA7D64;         /* Pantone 479C 輔色 */
  --clay-light:#C9A896;
  --sand:#F6E9DB;         /* 標準淺色 */
  --sand-deep:#EFDCC8;
  --paper:#FBF8F4;
  --line:#E8DACA;
  --line-soft:#F0E6DA;
  --gold:#C79A5B;
  --muted:#9A857A;
  --ok:#6E8B62; --ok-bg:#EEF3EB;
  --warn:#C08A3E; --warn-bg:#FBF1E2;
  --bad:#B4675A; --bad-bg:#F8ECE9;
  --info:#7C8FA6; --info-bg:#EEF1F5;
  --r-s:8px; --r-m:14px; --r-l:22px;
  --sh-1:0 1px 2px rgba(79,47,46,.05), 0 4px 16px rgba(79,47,46,.06);
  --sh-2:0 8px 30px rgba(79,47,46,.12);
  --serif:"Noto Serif TC",Georgia,"Songti TC",serif;
  --sans:"Noto Sans TC",-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.35}
::selection{background:var(--sand-deep)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:3px solid var(--paper)}

/* ============ 通用元件 ============ */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);
  background:#fff;cursor:pointer;transition:.18s;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--clay);color:var(--clay);transform:translateY(-1px)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:var(--clay);border-color:var(--clay);color:#fff}
.btn.clay{background:var(--clay);color:#fff;border-color:var(--clay)}
.btn.clay:hover{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ghost{background:transparent}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.ok:hover{background:#5d7752;border-color:#5d7752;color:#fff}
.btn.bad{background:#fff;color:var(--bad);border-color:var(--bad)}
.btn.bad:hover{background:var(--bad);color:#fff}
.btn.sm{padding:5px 12px;font-size:13px}
.btn.xs{padding:3px 10px;font-size:12px}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none!important}
.card{background:#fff;border:1px solid var(--line-soft);border-radius:var(--r-m);box-shadow:var(--sh-1)}
.card.pad{padding:22px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:500;letter-spacing:.02em}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.info{background:var(--info-bg);color:var(--info)}
.tag.sand{background:var(--sand);color:var(--ink-soft)} .tag.ink{background:var(--ink);color:#fff}
.tag.clay{background:var(--clay);color:#fff}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.row{display:flex;gap:12px;align-items:center} .row.wrap{flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
.grid{display:grid;gap:16px}
hr{border:0;border-top:1px solid var(--line-soft);margin:16px 0}
.sec-title{font-size:13px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:10px;font-family:var(--sans);font-weight:500}
input[type=text],input[type=date],input[type=number],input[type=email],select,textarea{
  width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-s);background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--clay);box-shadow:0 0 0 3px rgba(170,125,100,.12)}
label.fl{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:5px;font-weight:500}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#FDFBF8}

/* 進度條 */
.bar{height:7px;background:var(--sand);border-radius:99px;overflow:hidden;flex:1;min-width:60px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--clay),var(--gold));border-radius:99px;transition:width .5s}
.bar.thin{height:5px}
.bar.late>i{background:linear-gradient(90deg,var(--bad),#D08C7E)}

/* ============ 登入頁 ============ */
.login{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}
.login .left{background:var(--ink);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login .left::after{content:"";position:absolute;right:-180px;bottom:-180px;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(199,154,91,.28),transparent 62%)}
.login .left img{width:210px;filter:drop-shadow(0 6px 22px rgba(0,0,0,.28))}
.login h1{font-size:40px;letter-spacing:.02em;margin:26px 0 12px;color:#fff}
.login .lead{color:#E7D4C6;max-width:430px;font-weight:300;font-size:15px}
.login .kpis{display:flex;gap:30px;margin-top:30px;position:relative;z-index:2}
.login .kpis b{display:block;font-family:var(--serif);font-size:30px;color:var(--gold);line-height:1.2}
.login .kpis span{font-size:12px;color:#D9C4B4;letter-spacing:.08em}
.login .right{background:var(--paper);padding:56px 48px;display:flex;flex-direction:column;justify-content:center}
.rolecard{display:flex;gap:14px;align-items:center;width:100%;padding:14px 16px;border:1px solid var(--line);
  background:#fff;border-radius:var(--r-m);cursor:pointer;transition:.18s;text-align:left;margin-bottom:10px}
.rolecard:hover{border-color:var(--clay);box-shadow:var(--sh-1);transform:translateX(3px)}
.rolecard .av{width:42px;height:42px;border-radius:50%;background:var(--sand);display:grid;place-items:center;
  font-family:var(--serif);font-size:16px;color:var(--ink);flex:none}
.rolecard .av.dark{background:var(--ink);color:var(--sand)}
.rolecard b{font-weight:500;font-size:15px} .rolecard small{color:var(--muted);font-size:12.5px;display:block}

/* ============ 應用外框 ============ */
.shell{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;background:rgba(251,248,244,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:0 24px;display:flex;align-items:center;gap:20px;height:64px}
.topbar.dark{background:var(--ink);border-bottom-color:#5E3C39}
.topbar.dark .brand b,.topbar.dark .navlink{color:#EADBCC}
.topbar.dark .navlink:hover,.topbar.dark .navlink.on{color:#fff;background:rgba(255,255,255,.1)}
.brand{display:flex;align-items:center;gap:11px;flex:none}
.brand img{height:36px} .brand b{font-family:var(--serif);font-size:15.5px;font-weight:600;letter-spacing:.04em}
.brand small{display:block;font-size:10.5px;letter-spacing:.16em;color:var(--muted);font-weight:400}
.nav{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto}
.navlink{padding:7px 14px;border-radius:999px;font-size:14px;color:var(--ink-soft);cursor:pointer;white-space:nowrap;transition:.15s}
.navlink:hover{background:var(--sand)} .navlink.on{background:var(--ink);color:#fff}
.topbar.dark .navlink.on{background:var(--clay);color:#fff}
.me{display:flex;align-items:center;gap:10px;flex:none;cursor:pointer;padding:5px 6px 5px 12px;border-radius:999px}
.me:hover{background:var(--sand)} .topbar.dark .me:hover{background:rgba(255,255,255,.1)}
.me .av{width:33px;height:33px;border-radius:50%;background:var(--clay);color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
.me .nm{font-size:13.5px;line-height:1.25} .me .nm small{display:block;font-size:11px;color:var(--muted)}
.topbar.dark .me .nm{color:#EADBCC} .topbar.dark .me .nm small{color:#B69C8C}
main{flex:1;padding:26px 24px 60px;max-width:1360px;width:100%;margin:0 auto}
.page-head{margin-bottom:20px}
.page-head h2{font-size:25px} .page-head p{color:var(--muted);font-size:14px;margin-top:2px}

/* 統計卡 */
.stat{background:#fff;border:1px solid var(--line-soft);border-radius:var(--r-m);padding:16px 18px;box-shadow:var(--sh-1)}
.stat .lb{font-size:12.5px;color:var(--muted);letter-spacing:.04em}
.stat .vl{font-family:var(--serif);font-size:30px;line-height:1.25;margin-top:2px}
.stat .vl small{font-size:14px;color:var(--muted);font-family:var(--sans);margin-left:3px}
.stat.accent{background:var(--ink);color:#fff;border-color:var(--ink)}
.stat.accent .lb{color:#C9AE9C} .stat.accent .vl{color:var(--gold)}

/* 進度環 */
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-family:var(--serif);font-size:30px;line-height:1} .ring .c span{font-size:11px;color:var(--muted)}

/* 階段流程 */
.steps{display:flex;gap:0;overflow-x:auto;padding-bottom:4px}
.step{flex:1;min-width:150px;position:relative;padding:14px 12px 14px 0}
.step:not(:last-child)::after{content:"";position:absolute;left:14px;right:-2px;top:26px;height:2px;background:var(--line);z-index:0}
.step.done:not(:last-child)::after{background:var(--clay)}
.step .dot{width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--line);display:grid;place-items:center;
  font-size:12.5px;color:var(--muted);position:relative;z-index:1;margin-bottom:8px}
.step.done .dot{background:var(--clay);border-color:var(--clay);color:#fff}
.step.cur .dot{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 0 0 5px rgba(79,47,46,.10)}
.step b{font-size:13.5px;font-weight:500;display:block}
.step small{font-size:11.5px;color:var(--muted)}

/* 任務列 */
.task{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border:1px solid var(--line-soft);border-radius:var(--r-s);background:#fff;transition:.15s}
.task:hover{border-color:var(--line);box-shadow:var(--sh-1)}
.task .ic{width:30px;height:30px;border-radius:8px;background:var(--sand);display:grid;place-items:center;font-size:14px;flex:none}
.task.approved .ic{background:var(--ok-bg)} .task.rejected .ic{background:var(--bad-bg)} .task.submitted .ic{background:var(--warn-bg)}
.task .bd{flex:1;min-width:0}
.task .bd b{font-weight:500;font-size:14.5px}
.task.approved .bd b{color:var(--ink-soft)}

/* 側欄（後台） */
.adm{display:grid;grid-template-columns:232px 1fr;flex:1;min-height:0}
.side{background:#fff;border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:64px;height:calc(100vh - 64px);overflow-y:auto}
.side .grp{font-size:11px;letter-spacing:.14em;color:var(--muted);padding:14px 12px 6px}
.side a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-s);font-size:14px;color:var(--ink-soft);cursor:pointer}
.side a:hover{background:var(--sand)} .side a.on{background:var(--sand);color:var(--ink);font-weight:500;box-shadow:inset 3px 0 0 var(--clay)}
.side a .bdg{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;padding:0 7px;border-radius:99px;line-height:18px}

/* Modal */
.mask{position:fixed;inset:0;background:rgba(48,28,27,.45);backdrop-filter:blur(3px);z-index:90;display:grid;place-items:center;padding:20px;animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--paper);border-radius:var(--r-l);max-width:640px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--sh-2);animation:pop .22s}
@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal.wide{max-width:920px}
.modal .hd{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  position:sticky;top:0;background:var(--paper);z-index:2;border-radius:var(--r-l) var(--r-l) 0 0}
.modal .hd h3{font-size:19px} .modal .bd{padding:22px 24px}
.modal .ft{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:var(--paper)}
.x{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;flex:none;line-height:1}
.x:hover{background:var(--sand)}

/* Toast */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;box-shadow:var(--sh-2);font-size:14px;animation:up .25s}
.toast.ok{background:var(--ok)} .toast.bad{background:var(--bad)}
@keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}

/* AI 面板 */
.chat{display:flex;flex-direction:column;gap:12px;max-height:440px;overflow-y:auto;padding:4px}
.msg{max-width:86%;padding:11px 15px;border-radius:16px;font-size:14.3px;line-height:1.7}
.msg.ai{background:#fff;border:1px solid var(--line-soft);border-bottom-left-radius:5px;align-self:flex-start;box-shadow:var(--sh-1)}
.msg.u{background:var(--ink);color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.chip{padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--clay);color:var(--clay)}
.aibadge{display:inline-flex;align-items:center;gap:5px;font-size:11px;background:var(--sand);color:var(--ink-soft);padding:2px 9px;border-radius:99px}

/* 時間軸 */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tli{position:relative;padding:0 0 18px}
.tli::before{content:"";position:absolute;left:-23px;top:6px;width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid var(--line)}
.tli.done::before{background:var(--clay);border-color:var(--clay)}
.tli.now::before{background:var(--ink);border-color:var(--ink);box-shadow:0 0 0 4px rgba(79,47,46,.12)}

/* QR 示意 */
.qr{width:170px;height:170px;background:#fff;padding:9px;border:1px solid var(--line);border-radius:var(--r-s)}
.qr canvas{width:100%;height:100%;image-rendering:pixelated}

.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.empty .em{font-size:32px;opacity:.5;display:block;margin-bottom:8px}

@media(max-width:900px){
  .login{grid-template-columns:1fr} .login .left{padding:34px}
  .login .left img{width:150px} .login h1{font-size:29px}
  .adm{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:10px}
  .side .grp{display:none} .side a{white-space:nowrap} .side a.on{box-shadow:inset 0 -3px 0 var(--clay)}
  main{padding:18px 14px 50px} .topbar{padding:0 14px;gap:12px} .brand small{display:none}
}
/* 手機：所有兩欄版面收合成單欄 */
@media(max-width:820px){
  html,body{overflow-x:hidden;max-width:100vw}
  .grid{min-width:0}
  .grid>*{min-width:0}
  [style*="grid-template-columns:minmax"]{grid-template-columns:1fr!important}
  [style*="grid-template-columns:1fr 1fr"]{grid-template-columns:1fr!important}
  .card.pad{padding:16px}
  .page-head h2{font-size:21px}
  .card .row{flex-wrap:wrap}
  .spread{flex-wrap:wrap}
  .ring{margin:0 auto}
  .modal .bd{padding:18px 16px} .modal .hd{padding:16px}
  .stat .vl{font-size:25px}
  .brand b{font-size:14px}
  .nav{-ms-overflow-style:none;scrollbar-width:none} .nav::-webkit-scrollbar{display:none}
  .steps{margin:0 -4px;padding:0 4px 6px}
  .task .bd .spread{flex-wrap:wrap;gap:8px}
}
/* 手機：階段流程改直式清單，避免要橫向捲才看得到 */
@media(max-width:700px){
  .steps{display:block;overflow:visible}
  .step{min-width:0;padding:0 0 0 38px;position:relative;display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
  .step:not(:last-child)::after{left:13px;top:26px;right:auto;bottom:-12px;width:2px;height:auto}
  .step .dot{position:absolute;left:0;top:-2px;margin:0}
  .step b{font-size:14px} .step small{font-size:12px;color:var(--muted)}
}
@media(max-width:520px){
  .me .nm{display:none}
  .topbar{gap:8px}
  .step{min-width:132px}
}
@media print{
  .topbar,.side,.btn,.chips{display:none!important}
  body{background:#fff} main{max-width:none;padding:0}
  .card{box-shadow:none;border-color:#ddd;break-inside:avoid}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast"></div>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/front.js"></script>
<script src="js/admin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
